openapi: 3.0.3
info:
  title: NGO Registration API
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new NGO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_name, email, password]
              properties:
                org_name: { type: string, minLength: 1, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201':
          description: Registration initiated, OTP sent to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Verification OTP sent to your email" }
                  email: { type: string, example: "ngo@example.com" }

  /api/v1/auth/verify-otp:
    post:
      summary: Verify OTP and complete registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, org_name]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$' }
                org_name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Email verified, profile created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: "bearer" }

  /api/v1/auth/resend-otp:
    post:
      summary: Resend verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: New OTP sent to email.
